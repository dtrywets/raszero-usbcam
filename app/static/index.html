<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RasZero USB Cam</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>RasZero USB Cam</h1>
    <p id="device-info">Lade Kamera …</p>
  </header>

  <main>
    <section class="preview-panel">
      <div class="preview-wrap">
        <img id="preview" alt="Live-Vorschau">
      </div>
      <div class="stream-actions">
        <label>
          RTSP-Auflösung
          <select id="format-select"></select>
        </label>
        <label class="led-toggle">
          <input id="led-on" type="checkbox">
          Leuchtring
        </label>
        <button id="rtsp-toggle" type="button">RTSP starten</button>
        <code id="rtsp-url"></code>
      </div>
      <p class="hint">Vorschau: 640×480 @ 15 fps — hohe RTSP-Auflösungen nur beim Streamen.</p>
    </section>

    <section class="controls-panel">
      <h2>Kamera-Parameter</h2>
      <form id="controls-form"></form>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
